<!DOCTYPE html>
<html lang="ru" data-bs-theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Task Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .hero-section { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .product-device { position: absolute; right: 10%; bottom: -30%; width: 300px; height: 540px; background-color: #333; border-radius: 21px; transform: rotate(30deg); }
        .product-device-2 { top: -25%; right: auto; bottom: 0; left: 5%; background-color: #e5e5e5; }
        .task-card { transition: transform 0.2s; cursor: pointer; }
        .task-card:hover { transform: translateY(-2px); }
        .kanban-column { min-width: 300px; max-width: 350px; }
    </style>
</head>
<body>

<!-- Проверка авторизации -->
<script>
(function() {
    const token = localStorage.getItem('access');
    const publicPages = ['/login/', '/register/', '/'];
    const currentPath = window.location.pathname;

    if (!token && !publicPages.includes(currentPath)) {
        window.location.href = '/login/';
    }

    if (token && publicPages.includes(currentPath) && currentPath !== '/') {
        window.location.href = '/dashboard/';
    }
})();
</script>

<!-- Иконки -->
<svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="check2" viewBox="0 0 16 16"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/></symbol>
    <symbol id="circle-half" viewBox="0 0 16 16"><path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/></symbol>
    <symbol id="moon-stars-fill" viewBox="0 0 16 16"><path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/><path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162z"/></symbol>
    <symbol id="sun-fill" viewBox="0 0 16 16"><path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/></symbol>
    <symbol id="kanban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="11" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
</svg>

<!-- Навигация -->
<nav class="navbar navbar-expand-md bg-dark sticky-top border-bottom" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand d-md-none" href="/dashboard/">
            <svg class="bi" width="24" height="24"><use xlink:href="#kanban"></use></svg>
            Task Tracker
        </a>
        <a class="navbar-brand d-none d-md-block" href="/dashboard/">
            <svg class="bi me-2" width="24" height="24"><use xlink:href="#kanban"></use></svg>
            Task Tracker
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvas">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="offcanvas offcanvas-end" id="offcanvas">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Task Tracker</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body" id="navContent">
                <!-- Заполняется через JS -->
            </div>
        </div>
    </div>
</nav>

<!-- Контент -->
<main>{% block content %}{% endblock %}</main>

<!-- Футер -->
<footer class="container py-5 mt-5 border-top">
    <div class="row">
        <div class="col-12 col-md">
            <svg class="bi d-block mb-2" width="24" height="24"><use xlink:href="#kanban"></use></svg>
            <small class="d-block mb-3 text-body-secondary">&copy; 2025 Task Tracker</small>
        </div>
        <div class="col-6 col-md">
            <h5>Возможности</h5>
            <ul class="list-unstyled text-small">
                <li><a class="link-secondary text-decoration-none" href="/tasks/">Канбан-доска</a></li>
                <li><a class="link-secondary text-decoration-none" href="/projects/">Проекты</a></li>
                <li><a class="link-secondary text-decoration-none" href="#">Учёт времени</a></li>
                <li><a class="link-secondary text-decoration-none" href="/notifications/">Уведомления</a></li>
            </ul>
        </div>
        <div class="col-6 col-md">
            <h5>Ресурсы</h5>
            <ul class="list-unstyled text-small">
                <li><a class="link-secondary text-decoration-none" href="/swagger/">API (Swagger)</a></li>
                <li><a class="link-secondary text-decoration-none" href="/redoc/">API (ReDoc)</a></li>
            </ul>
        </div>
        <div class="col-6 col-md">
            <h5>О проекте</h5>
            <ul class="list-unstyled text-small">
                <li><a class="link-secondary text-decoration-none" href="#">GitHub</a></li>
                <li><a class="link-secondary text-decoration-none" href="#">Контакты</a></li>
            </ul>
        </div>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/theme.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/main.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
