{% extends 'base.html' %}
{% load static %}

{% block title %}Дашборд — Task Tracker{% endblock %}

{% block content %}

<section class="page">

    <div class="page-header">
        <div>
            <h1>Дашборд</h1>
            <p>Обзор задач и календарь</p>
        </div>
    </div>

    <!-- Статистика -->
    <div style="display:flex;gap:20px;margin-bottom:40px;">
        <div style="flex:1;padding:24px;border-radius:20px;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.06);">
            <h3 id="dashTotal" style="font-size:32px;font-weight:800;color:#111827;margin:0;">0</h3>
            <span style="color:#6b7280;">Всего задач</span>
        </div>
        <div style="flex:1;padding:24px;border-radius:20px;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.06);">
            <h3 id="dashInProgress" style="font-size:32px;font-weight:800;color:#f59e0b;margin:0;">0</h3>
            <span style="color:#6b7280;">В работе</span>
        </div>
        <div style="flex:1;padding:24px;border-radius:20px;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.06);">
            <h3 id="dashOverdue" style="font-size:32px;font-weight:800;color:#ef4444;margin:0;">0</h3>
            <span style="color:#6b7280;">Просрочено</span>
        </div>
        <div style="flex:1;padding:24px;border-radius:20px;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,.06);">
            <h3 id="dashDone" style="font-size:32px;font-weight:800;color:#10b981;margin:0;">0</h3>
            <span style="color:#6b7280;">Выполнено</span>
        </div>
    </div>

    <div style="display:flex;gap:30px;flex-wrap:wrap;">
        <!-- Календарь -->
        <div style="flex:1;min-width:350px;">
            <div style="background:rgba(255,255,255,.7);backdrop-filter:blur(20px);border-radius:30px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.05);">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                    <button class="btn btn-outline btn-sm" onclick="changeMonth(-1)">←</button>
                    <h3 id="monthTitle" style="margin:0;"></h3>
                    <button class="btn btn-outline btn-sm" onclick="changeMonth(1)">→</button>
                </div>
                <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px;color:#6b7280;margin-bottom:8px;">
                    <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
                </div>
                <div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;"></div>
            </div>
        </div>

        <!-- Задачи на день -->
        <div style="flex:1;min-width:300px;">
            <div style="background:rgba(255,255,255,.7);backdrop-filter:blur(20px);border-radius:30px;padding:30px;box-shadow:0 10px 30px rgba(0,0,0,.05);">
                <h3 id="selectedDateTitle" style="margin-bottom:20px;">Выберите дату</h3>
                <div id="dayTasks"><p style="color:#6b7280;">Нажмите на дату в календаре</p></div>
            </div>
        </div>
    </div>

</section>

<script>
var A = 'http://localhost:8000/api';
var T = localStorage.getItem('access');
var allTasks = [];
var curMonth = new Date().getMonth();
var curYear = new Date().getFullYear();
var selDate = null;

function loadDashboard() {
    fetch(A + '/tasks/tasks/?creator=' + JSON.parse(atob(T.split('.')[1])).user_id, ...)
        .then(r => r.json())
        .then(function(d) {
            allTasks = Array.isArray(d) ? d : (d.results || []);
            document.getElementById('dashTotal').textContent = allTasks.length;
            document.getElementById('dashInProgress').textContent = allTasks.filter(function(t){return t.status==='in_progress';}).length;
            document.getElementById('dashOverdue').textContent = allTasks.filter(function(t){return t.is_overdue;}).length;
            document.getElementById('dashDone').textContent = allTasks.filter(function(t){return t.status==='done';}).length;
            renderCalendar();
        });
}

function renderCalendar() {
    var months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    document.getElementById('monthTitle').textContent = months[curMonth] + ' ' + curYear;

    var firstDay = new Date(curYear, curMonth, 1).getDay() || 7;
    var days = new Date(curYear, curMonth + 1, 0).getDate();
    var today = new Date().toISOString().slice(0,10);

    var h = '';
    for (var i = 1; i < firstDay; i++) h += '<div></div>';

    for (var d = 1; d <= days; d++) {
        var ds = curYear + '-' + String(curMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        var count = allTasks.filter(function(t){ return t.deadline && t.deadline.startsWith(ds); }).length;
        var isToday = ds === today;
        var isSel = ds === selDate;
        h += '<div onclick="selectDate(\'' + ds + '\')" style="padding:8px;text-align:center;border-radius:12px;cursor:pointer;font-size:14px;' +
            (isToday ? 'background:#4f46e5;color:white;' : '') +
            (isSel && !isToday ? 'background:#e0e7ff;' : '') +
            '">' + d +
            (count > 0 ? '<div style="width:6px;height:6px;background:' + (isToday ? 'white' : '#4f46e5') + ';border-radius:50%;margin:4px auto 0;"></div>' : '') +
            '</div>';
    }
    document.getElementById('calendarGrid').innerHTML = h;
}

function selectDate(ds) {
    selDate = ds;
    renderCalendar();
    document.getElementById('selectedDateTitle').textContent = 'Дедлайн задач на ' + new Date(ds).toLocaleDateString('ru-RU', {day:'numeric',month:'long',year:'numeric'});
    var tasks = allTasks.filter(function(t){ return t.deadline && t.deadline.startsWith(ds); });
    var container = document.getElementById('dayTasks');
    if (tasks.length === 0) {
        container.innerHTML = '<p style="color:#6b7280;">Нет задач на этот день</p>';
    } else {
        container.innerHTML = tasks.map(function(t){
            return '<div style="background:white;border-radius:14px;padding:16px;margin-bottom:10px;border-left:4px solid ' + ({low:'#10b981',medium:'#f59e0b',high:'#f97316',critical:'#ef4444'}[t.priority]) + ';cursor:pointer;" onclick="location.href=\'/tasks/' + t.id + '/\'"><strong>' + t.title + '</strong><div style="font-size:13px;color:#6b7280;margin-top:4px;">' + (t.assignee?.full_name || 'Не назначена') + ' | ' + (t.project_name || 'Без проекта') + '</div><div style="font-size:12px;color:#4f46e5;margin-top:4px;">⏰ ' + new Date(t.deadline).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) + '</div></div>';
        }).join('');
    }
}

function changeMonth(delta) {
    curMonth += delta;
    if (curMonth < 0) { curMonth = 11; curYear--; }
    if (curMonth > 11) { curMonth = 0; curYear++; }
    renderCalendar();
}

loadDashboard();
</script>

{% endblock %}
