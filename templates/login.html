{% extends 'base.html' %}
{% block title %}Вход — Task Tracker{% endblock %}
{% block content %}
<div class="position-relative overflow-hidden p-3 p-md-5 text-center hero-section text-white">
    <div class="col-md-6 p-lg-4 mx-auto my-4">
        <h1 class="display-4 fw-bold">Task Tracker</h1>
        <p class="lead mb-4">Корпоративный трекер задач для команд</p>
    </div>
</div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4">Вход в систему</h3>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="user@company.ru" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Пароль</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••" required>
                        </div>
                        <div id="loginError" class="alert alert-danger d-none"></div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg">Войти</button>
                    </form>
                    <p class="mt-3 text-center">Нет аккаунта? <a href="/register/">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorDiv = document.getElementById('loginError');
    errorDiv.classList.add('d-none');
    const data = Object.fromEntries(new FormData(e.target));
    try {
        const response = await api.post('/users/token/', data);
        if (response.access) {
            localStorage.setItem('access', response.access);
            localStorage.setItem('refresh', response.refresh);
            window.location.href = '/dashboard/';
        }
    } catch (err) {
        errorDiv.textContent = 'Неверный email или пароль';
        errorDiv.classList.remove('d-none');
    }
});
</script>
{% endblock %}
