{% extends 'base.html' %}
{% load static %}

{% block title %}Вход — Task Tracker{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <h2>Вход в систему</h2>

        <form id="loginForm">

            <input type="email" name="email" placeholder="Email" required autocomplete="email"
                   style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;width:100%;margin-bottom:14px;">

            <input type="password" name="password" placeholder="Пароль" required autocomplete="current-password"
                   style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;width:100%;margin-bottom:14px;">

            <div id="loginError" style="color:#ef4444;font-size:14px;display:none;text-align:center;margin-bottom:14px;"></div>

            <button type="submit" class="btn btn-primary auth-btn" style="width:100%;">Войти</button>

        </form>

        <p style="text-align:center;margin-top:24px;color:#6b7280;">
            Нет аккаунта?
            <a href="/register/" style="color:#4f46e5;font-weight:600;text-decoration:none;">Регистрация</a>
        </p>

    </div>

</section>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const errorDiv = document.getElementById('loginError');
    errorDiv.style.display = 'none';

    const btn = this.querySelector('button');
    btn.textContent = 'Вход...';
    btn.disabled = true;

    const formData = new FormData(this);
    const data = {
        email: formData.get('email'),
        password: formData.get('password')
    };

    console.log('Отправка:', data);

    try {
        const response = await api.post('/users/token/', data);
        console.log('Ответ:', response);

        if (response.access) {
            localStorage.setItem('access', response.access);
            localStorage.setItem('refresh', response.refresh);
            window.location.href = '/home/';
        }
    } catch (err) {
        console.error('Ошибка:', err);
        errorDiv.textContent = 'Неверный email или пароль';
        errorDiv.style.display = 'block';
    } finally {
        btn.textContent = 'Войти';
        btn.disabled = false;
    }
});
</script>

{% endblock %}
