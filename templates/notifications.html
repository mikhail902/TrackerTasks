{% extends 'base.html' %}
{% block title %}Уведомления — Task Tracker{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2><i class="bi bi-bell"></i> Уведомления</h2>

    <div class="d-flex gap-2 mt-3 mb-4">
        <button class="btn btn-sm btn-outline-primary active" onclick="filterNotifs('all', this)">Все</button>
        <button class="btn btn-sm btn-outline-primary" onclick="filterNotifs('unread', this)">Непрочитанные</button>
        <button class="btn btn-sm btn-outline-success" onclick="markAllRead()">Прочитать все</button>
    </div>

    <div class="list-group" id="notificationsList">
        <div class="text-center py-5">Загрузка...</div>
    </div>

    <nav class="mt-3" id="notifPagination"></nav>
</div>
{% endblock %}

{% block scripts %}
<script>
let currentFilter = 'all';
let currentPage = 1;

async function loadNotifications(page = 1) {
    currentPage = page;
    const data = await api.get(`/tasks/notifications/?page=${page}`);
    const container = document.getElementById('notificationsList');
    let notifs = data.results || [];

    if (currentFilter === 'unread') {
        notifs = notifs.filter(n => !n.is_read);
    }

    if (notifs.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5">
                <i class="bi bi-bell-slash display-1 text-muted"></i>
                <h5 class="text-muted mt-3">Нет уведомлений</h5>
            </div>`;
        return;
    }

    container.innerHTML = notifs.map(n => `
        <div class="list-group-item ${n.is_read ? '' : 'list-group-item-warning'} d-flex justify-content-between align-items-center">
            <div>
                <div class="d-flex gap-2 align-items-center">
                    ${!n.is_read ? '<span class="badge bg-danger">Новое</span>' : ''}
                    <small class="text-muted">${new Date(n.created_at).toLocaleString()}</small>
                </div>
                <p class="mb-1 mt-1">${n.message}</p>
                ${n.task_title ? `<a href="/tasks/${n.task}/" class="small">${n.task_title}</a>` : ''}
            </div>
            <div>
                ${!n.is_read ? `<button class="btn btn-sm btn-outline-primary" onclick="markRead(${n.id})"><i class="bi bi-check2"></i></button>` : ''}
            </div>
        </div>
    `).join('');

    const pagDiv = document.getElementById('notifPagination');
    pagDiv.innerHTML = '';
    if (data.count > 20) {
        const totalPages = Math.ceil(data.count / 20);
        for (let i = 1; i <= totalPages; i++) {
            pagDiv.innerHTML += `<button class="btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'} me-1" onclick="loadNotifications(${i})">${i}</button>`;
        }
    }
}

function filterNotifs(filter, btn) {
    document.querySelectorAll('#notificationsList + div button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = filter;
    loadNotifications(currentPage);
}

async function markRead(id) {
    await api.post(`/tasks/notifications/${id}/read/`);
    loadNotifications(currentPage);
}

async function markAllRead() {
    const data = await api.get(`/tasks/notifications/`);
    for (const n of (data.results || [])) {
        if (!n.is_read) await api.post(`/tasks/notifications/${n.id}/read/`);
    }
    loadNotifications(currentPage);
}

loadNotifications();
</script>
{% endblock %}
