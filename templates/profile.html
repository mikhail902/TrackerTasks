{% extends 'base.html' %}
{% load static %}

{% block title %}Профиль — Task Tracker{% endblock %}

{% block content %}

<section class="page">

    <div class="profile-card">
        <div class="profile-avatar" id="avatarInitials">—</div>
        <h2 id="profileName">—</h2>
        <p id="profilePosition">—</p>
        <div class="profile-stats">
            <div><h3 id="profileTasks">0</h3><span>Задач</span></div>
            <div><h3 id="profileProjects">0</h3><span>Проектов</span></div>
            <div><h3 id="profileDone">0%</h3><span>Выполнено</span></div>
        </div>
    </div>

    <div class="profile-card" style="margin-top:30px;">
        <h2 style="font-size:24px;margin-bottom:20px;">📋 Информация</h2>
        <table style="width:100%;border-collapse:collapse;">
            <tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:12px 0;color:#6b7280;width:180px;">Фамилия</td>
                <td><input type="text" id="editLastName" style="border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:14px;width:100%;"></td>
            </tr>
            <tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:12px 0;color:#6b7280;">Имя</td>
                <td><input type="text" id="editFirstName" style="border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:14px;width:100%;"></td>
            </tr>
            <tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:12px 0;color:#6b7280;">Отчество</td>
                <td><input type="text" id="editMiddleName" style="border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:14px;width:100%;"></td>
            </tr>
            <tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:12px 0;color:#6b7280;">Email</td>
                <td style="padding:12px 0;text-align:right;font-weight:500;color:#6b7280;" id="infoEmail">—</td>
            </tr>
            <tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:12px 0;color:#6b7280;">Телефон</td>
                <td><input type="text" id="editPhone" style="border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:14px;width:100%;"></td>
            </tr>
            <tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:12px 0;color:#6b7280;">Должность</td>
                <td><input type="text" id="editPosition" style="border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:14px;width:100%;"></td>
            </tr>
            <tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:12px 0;color:#6b7280;">Telegram Chat ID</td>
                <td><input type="text" id="editTelegram" style="border:1px solid #d1d5db;border-radius:10px;padding:8px 12px;font-size:14px;width:100%;"></td>
            </tr>
            <tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:12px 0;color:#6b7280;">Роль</td>
                <td style="padding:12px 0;text-align:right;font-weight:500;" id="infoRole">—</td>
            </tr>
            <tr style="border-bottom:1px solid #f3f4f6;">
                <td style="padding:12px 0;color:#6b7280;">Отдел</td>
                <td style="padding:12px 0;text-align:right;font-weight:500;" id="infoDepartment">—</td>
            </tr>
            <tr>
                <td style="padding:12px 0;color:#6b7280;">Дата регистрации</td>
                <td style="padding:12px 0;text-align:right;font-weight:500;" id="infoCreated">—</td>
            </tr>
        </table>
        <div id="profileMsg" style="text-align:center;font-size:14px;margin-top:20px;display:none;"></div>
        <button id="saveBtn" class="btn btn-primary" style="width:100%;margin-top:16px;" onclick="saveProfile()">💾 Сохранить</button>
    </div>

</section>

<script>
var A = 'http://localhost:8000/api';
var T = localStorage.getItem('access');

function loadProfile() {
    if (!T) return;
    Promise.all([
        fetch(A + '/users/me/', { headers: { 'Authorization': 'Bearer ' + T } }).then(r => r.json()),
        fetch(A + '/tasks/tasks/my/', { headers: { 'Authorization': 'Bearer ' + T } }).then(r => r.json()),
        fetch(A + '/tasks/projects/', { headers: { 'Authorization': 'Bearer ' + T } }).then(r => r.json())
    ]).then(function(results) {
        var profile = results[0];
        var tasks = Array.isArray(results[1]) ? results[1] : (results[1].results || []);
        var projects = Array.isArray(results[2]) ? results[2] : (results[2].results || []);
        var done = tasks.filter(function(t) { return t.status === 'done'; }).length;
        var percent = tasks.length ? Math.round((done / tasks.length) * 100) : 0;

        document.getElementById('avatarInitials').textContent = (profile.last_name?.[0] || '') + (profile.first_name?.[0] || '');
        document.getElementById('profileName').textContent = (profile.last_name || '') + ' ' + (profile.first_name || '');
        document.getElementById('profilePosition').textContent = profile.position || 'Не указана';
        document.getElementById('profileTasks').textContent = tasks.length;
        document.getElementById('profileProjects').textContent = projects.length;
        document.getElementById('profileDone').textContent = percent + '%';

        document.getElementById('editLastName').value = profile.last_name || '';
        document.getElementById('editFirstName').value = profile.first_name || '';
        document.getElementById('editMiddleName').value = profile.middle_name || '';
        document.getElementById('editPhone').value = profile.phone || '';
        document.getElementById('editPosition').value = profile.position || '';
        document.getElementById('editTelegram').value = profile.telegram_chat_id || '';
        document.getElementById('infoEmail').textContent = profile.email || '—';
        document.getElementById('infoRole').textContent = profile.role || '—';
        document.getElementById('infoDepartment').textContent = profile.department_name || '—';
        document.getElementById('infoCreated').textContent = profile.created_at ? new Date(profile.created_at).toLocaleDateString('ru-RU') : '—';
    });
}
function saveProfile() {
    var msg = document.getElementById('profileMsg');
    var btn = document.getElementById('saveBtn');
    btn.textContent = 'Сохранение...';
    btn.disabled = true;

    var data = {};
    var fields = ['first_name', 'last_name', 'middle_name', 'phone', 'position', 'telegram_chat_id'];
    var ids = ['editFirstName', 'editLastName', 'editMiddleName', 'editPhone', 'editPosition', 'editTelegram'];

    for (var i = 0; i < fields.length; i++) {
        var val = document.getElementById(ids[i]).value.trim();
        if (val) data[fields[i]] = val;
    }

    fetch(A + '/users/me/', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + T },
        body: JSON.stringify(data),
    }).then(function(r) {
        if (r.ok) { msg.textContent = '✅ Профиль обновлён'; msg.style.color = '#10b981'; }
        else { r.json().then(function(e) { msg.textContent = '❌ ' + JSON.stringify(e); }); }
        msg.style.color = '#ef4444';
        msg.style.display = 'block';
        loadProfile();
    }).catch(function() {
        msg.textContent = '❌ Ошибка сети'; msg.style.color = '#ef4444'; msg.style.display = 'block';
    }).finally(function() {
        btn.textContent = '💾 Сохранить'; btn.disabled = false;
        setTimeout(function() { msg.style.display = 'none'; }, 3000);
    });
}

loadProfile();
</script>

{% endblock %}
