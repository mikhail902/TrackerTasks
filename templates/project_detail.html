{% extends 'base.html' %}
{% load static %}

{% block title %}Проект — Task Tracker{% endblock %}

{% block content %}

<section class="page">

    <div id="projectContent">
        <p style="color:#6b7280;text-align:center;padding:60px;">Загрузка...</p>
    </div>

</section>

<!-- Модалка приглашения -->
<div id="inviteModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1001;align-items:center;justify-content:center;">
    <div class="auth-card" style="max-width:450px;">
        <h2>📨 Пригласить участника</h2>
        <input type="hidden" id="inviteProjectId">
        <input type="email" id="inviteEmail" placeholder="Email" required style="height:50px;width:100%;margin-bottom:12px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
        <select id="inviteRole" style="height:50px;width:100%;margin-bottom:16px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
            <option value="developer">Разработчик</option>
            <option value="manager">Менеджер</option>
            <option value="designer">Дизайнер</option>
            <option value="tester">Тестировщик</option>
        </select>
        <div id="inviteError" style="color:#ef4444;font-size:14px;display:none;margin-bottom:12px;"></div>
        <div style="display:flex;gap:12px;">
            <button class="btn btn-outline" style="flex:1;" onclick="closeInviteModal()">Отмена</button>
            <button class="btn btn-primary" style="flex:1;" onclick="sendInvite()">Отправить</button>
        </div>
    </div>
</div>

<!-- Модалка создания задачи -->
<div id="taskModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;">
    <div class="auth-card" style="max-width:600px;margin:0;">
        <h2>Новая задача в проекте</h2>
        <div style="display:flex;flex-direction:column;gap:14px;">
            <input type="text" id="taskTitle" placeholder="Название" required style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;width:100%;">
            <textarea id="taskDesc" placeholder="Описание" rows="3" style="border:1px solid #d1d5db;border-radius:14px;padding:16px;font-size:15px;resize:vertical;width:100%;"></textarea>
            <div style="display:flex;gap:12px;">
                <select id="taskPriority" style="flex:1;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
                    <option value="low">Низкий</option><option value="medium" selected>Средний</option><option value="high">Высокий</option><option value="critical">Критичный</option>
                </select>
                <select id="taskAssignee" style="flex:1;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
                    <option value="">Не назначен</option>
                </select>
            </div>
            <input type="datetime-local" id="taskDeadline" required style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;width:100%;">
            <div style="display:flex;gap:12px;">
                <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeTaskModal()">Отмена</button>
                <button class="btn btn-primary" style="flex:1;" onclick="saveTask()">Создать</button>
            </div>
        </div>
    </div>
</div>

<script>
var A = 'http://localhost:8000/api';
var T = localStorage.getItem('access');
var H = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + T };
var projectId = window.location.pathname.split('/').filter(Boolean).pop();

function loadProject() {
    Promise.all([
        fetch(A + '/tasks/projects/' + projectId + '/', { headers: { 'Authorization': 'Bearer ' + T } }).then(r => r.json()),
        fetch(A + '/tasks/tasks/?project=' + projectId, { headers: { 'Authorization': 'Bearer ' + T } }).then(r => r.json())
    ]).then(function(results) {
        var project = results[0];
        var tasksData = results[1];
        var tasks = Array.isArray(tasksData) ? tasksData : (tasksData.results || []);

        var total = tasks.length;
        var done = tasks.filter(function(t) { return t.status === 'done'; }).length;
        var inProgress = tasks.filter(function(t) { return t.status === 'in_progress'; }).length;
        var review = tasks.filter(function(t) { return t.status === 'review'; }).length;
        var todo = tasks.filter(function(t) { return t.status === 'todo'; }).length;
        var backlog = tasks.filter(function(t) { return t.status === 'backlog'; }).length;
        var overdue = tasks.filter(function(t) { return t.is_overdue; }).length;

        var team = project.team || [];
        var isManager = project.manager?.id === JSON.parse(atob(T.split('.')[1])).user_id;

        var teamHtml = '';
        for (var i = 0; i < team.length; i++) {
            teamHtml += '<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;">' +
                '<div style="display:flex;align-items:center;gap:8px;">' +
                '<div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#2563eb);color:white;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;">' + (team[i].full_name || '?')[0] + '</div>' +
                '<span>' + (team[i].full_name || '—') + '</span></div>' +
                (isManager ? '<button class="btn btn-outline btn-sm" style="color:#ef4444;padding:4px 10px;font-size:11px;" onclick="removeMember(' + team[i].id + ')">🗑</button>' : '') +
                '</div>';
        }
        if (team.length === 0) teamHtml = '<p style="color:#9ca3af;">Нет участников</p>';

        document.getElementById('projectContent').innerHTML =
            '<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:30px;">' +
            '<div><h1>' + project.name + '</h1><p style="color:#6b7280;">' + (project.description || 'Нет описания') + '</p></div>' +
            '<span class="status ' + (project.status === 'active' ? 'progress' : 'done') + '">' + project.status + '</span></div>' +

            '<div style="display:flex;gap:20px;margin-bottom:30px;">' +
            '<div style="flex:1;background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.04);"><h2 style="color:#4f46e5;">' + total + '</h2><span>Всего задач</span></div>' +
            '<div style="flex:1;background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.04);"><h2 style="color:#f59e0b;">' + inProgress + '</h2><span>В работе</span></div>' +
            '<div style="flex:1;background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.04);"><h2 style="color:#ef4444;">' + overdue + '</h2><span>Просрочено</span></div>' +
            '<div style="flex:1;background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.04);"><h2 style="color:#10b981;">' + done + '</h2><span>Выполнено</span></div>' +
            '</div>' +

            '<div style="display:flex;gap:30px;">' +
            '<div style="flex:2;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
            '<h3 style="margin:0;">📋 Задачи проекта</h3>' +
            '<button class="btn btn-primary btn-sm" onclick="openTaskModal()">+ Новая задача</button>' +
            '</div>' +
            (tasks.length === 0 ? '<p style="color:#9ca3af;">Нет задач</p>' :
            tasks.map(function(t) {
                return '<div onclick="location.href=\'/tasks/' + t.id + '/\'" style="background:white;border-radius:14px;padding:16px;margin-bottom:10px;border-left:4px solid ' + ({low:'#10b981',medium:'#f59e0b',high:'#f97316',critical:'#ef4444'}[t.priority]) + ';cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.04);"><div style="display:flex;justify-content:space-between;"><strong>' + t.title + '</strong><span class="status ' + (t.status === 'done' ? 'done' : 'progress') + '">' + t.status + '</span></div><div style="font-size:13px;color:#6b7280;margin-top:4px;">' + (t.assignee?.full_name || 'Не назначена') + (t.deadline ? ' | 📅 ' + new Date(t.deadline).toLocaleDateString('ru-RU') : '') + '</div></div>';
            }).join('')) +
            '</div>' +

            '<div style="flex:1;">' +
            '<div style="background:white;border-radius:20px;padding:24px;box-shadow:0 4px 15px rgba(0,0,0,.04);margin-bottom:20px;">' +
            '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">' +
            '<h3 style="margin:0;">👥 Участники (' + team.length + ')</h3>' +
            (isManager ? '<button class="btn btn-outline btn-sm" onclick="openInviteModal()">+</button>' : '') +
            '</div>' + teamHtml + '</div>' +

            '<div style="background:white;border-radius:20px;padding:24px;box-shadow:0 4px 15px rgba(0,0,0,.04);">' +
            '<h3 style="margin-bottom:16px;">📊 Статусы</h3>' +
            '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;"><span>📦 Бэклог</span><strong>' + backlog + '</strong></div>' +
            '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;"><span>📋 К выполнению</span><strong>' + todo + '</strong></div>' +
            '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;"><span>⚡ В работе</span><strong>' + inProgress + '</strong></div>' +
            '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f3f4f6;"><span>👀 На проверке</span><strong>' + review + '</strong></div>' +
            '<div style="display:flex;justify-content:space-between;padding:8px 0;"><span>✅ Выполнено</span><strong>' + done + '</strong></div>' +
            '</div></div></div>';
    });
}

function openInviteModal() {
    document.getElementById('inviteEmail').value = '';
    document.getElementById('inviteError').style.display = 'none';
    document.getElementById('inviteModal').style.display = 'flex';
}
function closeInviteModal() { document.getElementById('inviteModal').style.display = 'none'; }

function sendInvite() {
    var email = document.getElementById('inviteEmail').value;
    if (!email) { document.getElementById('inviteError').textContent = 'Введите email'; document.getElementById('inviteError').style.display = 'block'; return; }
    fetch(A + '/tasks/projects/' + projectId + '/invite/', {
        method: 'POST', headers: H, body: JSON.stringify({ email: email })
    }).then(r => r.json()).then(function(d) {
        if (d.status === 'invited') { closeInviteModal(); loadProject(); }
        else { document.getElementById('inviteError').textContent = d.error; document.getElementById('inviteError').style.display = 'block'; }
    });
}

function removeMember(userId) {
    if (!confirm('Удалить участника из проекта?')) return;
    fetch(A + '/tasks/projects/' + projectId + '/remove-member/', {
        method: 'POST', headers: H, body: JSON.stringify({ user_id: userId })
    }).then(function() { loadProject(); });
}

function openTaskModal() {
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskDesc').value = '';
    document.getElementById('taskPriority').value = 'medium';
    document.getElementById('taskAssignee').innerHTML = '<option value="">Не назначен</option>';
    var d = new Date(); d.setDate(d.getDate() + 7);
    document.getElementById('taskDeadline').value = d.toISOString().slice(0, 16);
    document.getElementById('taskModal').style.display = 'flex';
    // Загрузить участников проекта
    fetch(A + '/tasks/tasks/project-users/?project_id=' + projectId, { headers: { 'Authorization': 'Bearer ' + T } })
        .then(r => r.json()).then(function(users) {
            document.getElementById('taskAssignee').innerHTML = '<option value="">Не назначен</option>' +
                users.map(function(u) { return '<option value="' + u.id + '">' + u.full_name + '</option>'; }).join('');
        });
}
function closeTaskModal() { document.getElementById('taskModal').style.display = 'none'; }

function saveTask() {
    var data = {
        title: document.getElementById('taskTitle').value,
        description: document.getElementById('taskDesc').value,
        priority: document.getElementById('taskPriority').value,
        project: projectId,
        assignee: document.getElementById('taskAssignee').value || undefined,
        deadline: document.getElementById('taskDeadline').value,
    };
    if (!data.assignee) delete data.assignee;
    fetch(A + '/tasks/tasks/', { method: 'POST', headers: H, body: JSON.stringify(data) })
        .then(function() { closeTaskModal(); loadProject(); });
}

loadProject();
</script>

{% endblock %}
