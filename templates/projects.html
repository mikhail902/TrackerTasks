{% extends 'base.html' %}
{% load static %}

{% block title %}Проекты — Task Tracker{% endblock %}

{% block content %}

<section class="page">

    <div class="page-header">
        <div>
            <h1>Проекты</h1>
            <p>Все проекты компании</p>
        </div>
        <button class="btn btn-primary" onclick="openProjectModal()">+ Новый проект</button>
    </div>

    <div class="projects-grid" id="projectsContainer">
        <p style="color:#6b7280;text-align:center;padding:60px;">Загрузка...</p>
    </div>

</section>

<!-- Модалка проекта -->
<div id="projectModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center;">
    <div class="auth-card" style="max-width:500px;margin:0;">
        <h2 id="projectModalTitle">Новый проект</h2>
        <form id="projectForm" style="display:flex;flex-direction:column;gap:16px;">
            <input type="hidden" name="id" id="projectId">
            <input type="text" name="name" placeholder="Название проекта" required style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
            <textarea name="description" placeholder="Описание" rows="3" style="border:1px solid #d1d5db;border-radius:14px;padding:16px;font-size:15px;resize:vertical;"></textarea>
            <input type="datetime-local" name="deadline" style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
            <div id="projectError" style="color:#ef4444;font-size:14px;display:none;"></div>
            <div style="display:flex;gap:12px;">
                <button type="button" class="btn btn-outline" style="flex:1;" onclick="closeProjectModal()">Отмена</button>
                <button type="submit" class="btn btn-primary" style="flex:1;">Сохранить</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
async function loadProjects() {
    try {
        const data = await api.get('/tasks/projects/');
        const projects = data.results || [];
        const container = document.getElementById('projectsContainer');

        if (projects.length === 0) {
            container.innerHTML = `
                <div style="text-align:center;padding:60px;grid-column:1/-1;">
                    <div style="font-size:48px;margin-bottom:16px;">📁</div>
                    <h3 style="color:#6b7280;">Нет проектов</h3>
                    <p style="color:#9ca3af;">Создайте первый проект</p>
                    <button class="btn btn-primary" onclick="openProjectModal()">+ Создать проект</button>
                </div>`;
            return;
        }

        container.innerHTML = projects.map(p => {
            const totalTasks = p.tasks_count || 0;
            const completedTasks = p.completed_tasks_count || 0;
            const percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            return `
                <div class="project-card">
                    <div class="project-gradient"></div>
                    <div style="display:flex;justify-content:space-between;align-items:start;">
                        <h3 style="cursor:pointer;" onclick="location.href='/tasks/?project=${p.id}'">${p.name}</h3>
                        <div style="display:flex;gap:8px;">
                            <button class="btn btn-outline btn-sm" style="padding:8px 12px;font-size:12px;" onclick="editProject(${p.id}, '${escapeHtml(p.name)}', '${escapeHtml(p.description || '')}', '${p.deadline || ''}')">✏️</button>
                            <button class="btn btn-outline btn-sm" style="padding:8px 12px;font-size:12px;color:#ef4444;" onclick="deleteProject(${p.id})">🗑</button>
                        </div>
                    </div>
                    <p>${p.description || 'Нет описания'}</p>
                    <div class="project-progress">
                        <div class="progress-line">
                            <div class="progress-fill" style="width:${percent}%;"></div>
                        </div>
                        <span>${percent}%</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;margin-top:12px;color:#6b7280;font-size:14px;">
                        <span>${completedTasks}/${totalTasks} задач</span>
                        <span>👤 ${p.manager?.full_name || '—'}</span>
                    </div>
                </div>`;
        }).join('');
    } catch(e) {
        document.getElementById('projectsContainer').innerHTML = '<p style="color:#ef4444;text-align:center;padding:60px;">Ошибка загрузки</p>';
    }
}

function escapeHtml(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

function openProjectModal() {
    document.getElementById('projectModalTitle').textContent = 'Новый проект';
    document.getElementById('projectForm').reset();
    document.getElementById('projectId').value = '';
    document.getElementById('projectModal').style.display = 'flex';
}

function closeProjectModal() {
    document.getElementById('projectModal').style.display = 'none';
}

function editProject(id, name, desc, deadline) {
    document.getElementById('projectModalTitle').textContent = 'Редактировать проект';
    document.getElementById('projectId').value = id;
    document.querySelector('#projectForm [name="name"]').value = name;
    document.querySelector('#projectForm [name="description"]').value = desc;
    if (deadline) document.querySelector('#projectForm [name="deadline"]').value = deadline.slice(0, 16);
    document.getElementById('projectModal').style.display = 'flex';
}

async function deleteProject(id) {
    if (!confirm('Удалить проект? Все задачи будут удалены.')) return;
    await api.delete(`/tasks/projects/${id}/`);
    loadProjects();
}

document.getElementById('projectForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target));
    const id = data.id;
    delete data.id;
    if (!data.deadline) delete data.deadline;

    try {
        if (id) await api.patch(`/tasks/projects/${id}/`, data);
        else await api.post('/tasks/projects/', data);
        closeProjectModal();
        loadProjects();
    } catch(err) {
        document.getElementById('projectError').textContent = 'Ошибка сохранения';
        document.getElementById('projectError').style.display = 'block';
    }
});

loadProjects();
</script>
{% endblock %}
