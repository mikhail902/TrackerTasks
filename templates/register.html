{% extends 'base.html' %}
{% load static %}

{% block title %}Регистрация — Task Tracker{% endblock %}

{% block content %}

<section class="auth-page">
    <div class="auth-card">
        <h2>Регистрация</h2>

        <form id="registerForm">
            <div style="display:flex;gap:12px;margin-bottom:14px;">
                <input type="text" name="last_name" placeholder="Фамилия" required
                       style="flex:1;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
                <input type="text" name="first_name" placeholder="Имя" required
                       style="flex:1;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
            </div>

            <input type="text" name="position" placeholder="Должность" required
                   style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;width:100%;margin-bottom:14px;">

            <input type="email" name="email" placeholder="Email" required autocomplete="email"
                   style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;width:100%;margin-bottom:14px;">

            <input type="password" name="password" placeholder="Пароль (мин. 8 символов)" required minlength="8"
                   style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;width:100%;margin-bottom:14px;">

            <input type="password" name="password_confirm" placeholder="Подтвердите пароль" required minlength="8"
                   style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;width:100%;margin-bottom:14px;">

            <div id="registerError" style="color:#ef4444;font-size:14px;display:none;text-align:center;margin-bottom:14px;"></div>
            <div id="registerSuccess" style="color:#10b981;font-size:14px;display:none;text-align:center;margin-bottom:14px;"></div>

            <button type="submit" class="btn btn-primary auth-btn" style="width:100%;">Создать аккаунт</button>
        </form>

        <p style="text-align:center;margin-top:24px;color:#6b7280;">
            Уже есть аккаунт?
            <a href="/login/" style="color:#4f46e5;font-weight:600;text-decoration:none;">Войти</a>
        </p>
    </div>
</section>

<script>
document.getElementById('registerForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const errorDiv = document.getElementById('registerError');
    const successDiv = document.getElementById('registerSuccess');
    const btn = this.querySelector('button');

    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    const formData = new FormData(this);
    const password = formData.get('password');
    const passwordConfirm = formData.get('password_confirm');
    const email = formData.get('email');

    // Проверка паролей
    if (password !== passwordConfirm) {
        errorDiv.textContent = 'Пароли не совпадают';
        errorDiv.style.display = 'block';
        return;
    }

    if (password.length < 8) {
        errorDiv.textContent = 'Пароль должен быть не менее 8 символов';
        errorDiv.style.display = 'block';
        return;
    }

    btn.textContent = 'Регистрация...';
    btn.disabled = true;

    try {
        // 1. Регистрируем пользователя
        const registerResponse = await fetch('http://localhost:8000/api/users/register/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: email,
                password: password,
                first_name: formData.get('first_name'),
                last_name: formData.get('last_name'),
                position: formData.get('position')
            }),
        });

        if (!registerResponse.ok) {
            const err = await registerResponse.json();
            throw new Error(err.email?.[0] || err.detail || 'Ошибка регистрации');
        }

        // 2. Сразу получаем токен
        const tokenResponse = await fetch('http://localhost:8000/api/users/token/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password }),
        });

        const tokenData = await tokenResponse.json();

        if (tokenData.access) {
            localStorage.setItem('access', tokenData.access);
            localStorage.setItem('refresh', tokenData.refresh);
            successDiv.textContent = '✅ Регистрация успешна!';
            successDiv.style.display = 'block';
            setTimeout(() => {
                window.location.href = '/home/';
            }, 500);
        } else {
            // Зарегистрировались, но токен не получили — идём на логин
            successDiv.textContent = '✅ Аккаунт создан! Перенаправляем на вход...';
            successDiv.style.display = 'block';
            setTimeout(() => {
                window.location.href = '/login/';
            }, 1000);
        }
    } catch (error) {
        console.error(error);
        errorDiv.textContent = error.message || 'Ошибка регистрации';
        errorDiv.style.display = 'block';
    } finally {
        btn.textContent = 'Создать аккаунт';
        btn.disabled = false;
    }
});
</script>

{% endblock %}
