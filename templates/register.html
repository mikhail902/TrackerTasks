{% extends 'base.html' %}
{% load static %}

{% block title %}Регистрация — Task Tracker{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-card">

        <h2>Регистрация</h2>

        <form id="registerForm">

            <div style="display:flex;gap:12px;">
                <input type="text" name="last_name" placeholder="Фамилия" required style="flex:1;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
                <input type="text" name="first_name" placeholder="Имя" required style="flex:1;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
            </div>

            <input type="text" name="position" placeholder="Должность" required style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">

            <input type="email" name="email" placeholder="Email" required autocomplete="email" style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">

            <input type="password" name="password" placeholder="Пароль (мин. 8 символов)" required minlength="8" autocomplete="new-password" style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">

            <input type="password" name="password_confirm" placeholder="Подтвердите пароль" required minlength="8" style="height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">

            <div id="registerError" style="color:#ef4444;font-size:14px;display:none;text-align:center;"></div>
            <div id="registerSuccess" style="color:#10b981;font-size:14px;display:none;text-align:center;"></div>

            <button type="submit" class="btn btn-primary auth-btn">Создать аккаунт</button>

        </form>

        <p style="text-align:center;margin-top:24px;color:#6b7280;">
            Уже есть аккаунт?
            <a href="/login/" style="color:#4f46e5;font-weight:600;text-decoration:none;">Войти</a>
        </p>

    </div>

</section>

{% endblock %}

{% block scripts %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const errorDiv = document.getElementById('registerError');
    const successDiv = document.getElementById('registerSuccess');
    errorDiv.style.display = 'none';
    successDiv.style.display = 'none';

    const formData = new FormData(e.target);
    const password = formData.get('password');
    const passwordConfirm = formData.get('password_confirm');

    // Проверка паролей
    if (password !== passwordConfirm) {
        errorDiv.textContent = 'Пароли не совпадают';
        errorDiv.style.display = 'block';
        return;
    }

    if (password.length < 8) {
        errorDiv.textContent = 'Пароль должен быть не менее 8 символов';
        errorDiv.style.display = 'block';
        return;
    }

    const data = {
        email: formData.get('email'),
        password: password,
        first_name: formData.get('first_name'),
        last_name: formData.get('last_name'),
        position: formData.get('position')
    };

    const btn = e.target.querySelector('button');
    btn.textContent = 'Регистрация...';
    btn.disabled = true;

    try {
        await api.post('/users/register/', data);
        successDiv.textContent = '✅ Регистрация успешна! Перенаправляем...';
        successDiv.style.display = 'block';
        setTimeout(() => window.location.href = '/login/', 1500);
    } catch (err) {
        const msg = typeof err === 'object' ? (err.email?.[0] || err.detail || 'Ошибка регистрации') : 'Ошибка сервера';
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
    } finally {
        btn.textContent = 'Создать аккаунт';
        btn.disabled = false;
    }
});
</script>
{% endblock %}
