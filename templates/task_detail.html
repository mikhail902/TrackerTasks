{% extends 'base.html' %}
{% load static %}

{% block title %}Задача — Task Tracker{% endblock %}

{% block content %}

<section class="page">

    <div class="task-detail-card" id="taskContent">
        <p style="color:#6b7280;text-align:center;padding:60px;">Загрузка...</p>
    </div>

    <div class="task-detail-card" style="margin-top:30px;">
        <h2 style="font-size:24px;margin-bottom:24px;">💬 Комментарии</h2>
        <div id="commentsList" style="margin-bottom:20px;"></div>
        <div style="display:flex;gap:12px;">
            <input type="text" id="commentInput" placeholder="Добавить комментарий..." style="flex:1;height:50px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
            <button class="btn btn-primary" onclick="addComment()">Отправить</button>
        </div>
    </div>

</section>

<!-- Модалка "Поделиться" -->
<div id="shareModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1001;align-items:center;justify-content:center;">
    <div class="auth-card" style="max-width:450px;">
        <h2>📨 Поделиться задачей</h2>
        <label style="font-size:14px;color:#374151;margin-bottom:4px;display:block;">Email участника</label>
        <input type="email" id="shareEmail" placeholder="user@example.com" required style="height:50px;width:100%;margin-bottom:12px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
        <label style="font-size:14px;color:#374151;margin-bottom:4px;display:block;">Роль</label>
        <select id="shareRole" style="height:50px;width:100%;margin-bottom:12px;border:1px solid #d1d5db;border-radius:14px;padding:0 16px;font-size:15px;">
            <option value="viewer">Наблюдатель</option>
            <option value="executor">Исполнитель</option>
            <option value="reviewer">Проверяющий</option>
        </select>
        <div id="shareError" style="color:#ef4444;font-size:14px;display:none;margin-bottom:12px;"></div>
        <div style="display:flex;gap:12px;">
            <button class="btn btn-outline" style="flex:1;" onclick="closeShareModal()">Отмена</button>
            <button class="btn btn-primary" style="flex:1;" onclick="sendShare()">Отправить</button>
        </div>
    </div>
</div>

<script>
var A = 'http://localhost:8000/api';
var T = localStorage.getItem('access');
var H = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + T };
var taskId = window.location.pathname.split('/').filter(Boolean).pop();

function loadTask() {
    Promise.all([
        fetch(A + '/tasks/tasks/' + taskId + '/', { headers: { 'Authorization': 'Bearer ' + T } }).then(r => r.json()),
        fetch(A + '/tasks/tasks/' + taskId + '/comments/', { headers: { 'Authorization': 'Bearer ' + T } }).then(r => r.json()),
        fetch(A + '/users/', { headers: { 'Authorization': 'Bearer ' + T } }).then(r => r.json())
    ]).then(function(results) {
        var task = results[0];
        var comments = Array.isArray(results[1]) ? results[1] : (results[1].results || []);
        var users = Array.isArray(results[2]) ? results[2] : (results[2].results || results[2]);

        document.getElementById('taskContent').innerHTML =
            '<div class="task-detail-top"><div><h1>' + task.title + '</h1><p>' + (task.description || 'Нет описания') + '</p></div>' +
            '<span class="status ' + (task.status === 'done' ? 'done' : task.status === 'review' ? 'review' : 'progress') + '">' + (task.status === 'in_progress' ? 'В работе' : task.status === 'review' ? 'На проверке' : task.status === 'done' ? 'Выполнено' : task.status) + '</span></div>' +

            '<div class="task-info-grid">' +
            '<div class="info-box"><span>Исполнитель</span>' +
            '<select id="editAssignee" style="margin-top:8px;height:40px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:14px;width:100%;">' +
            '<option value="">Не назначен</option>' +
            users.map(function(u) { return '<option value="' + u.id + '" ' + (task.assignee?.id === u.id ? 'selected' : '') + '>' + (u.full_name || u.last_name) + '</option>'; }).join('') +
            '</select></div>' +

            '<div class="info-box"><span>Приоритет</span>' +
            '<select id="editPriority" style="margin-top:8px;height:40px;border:1px solid #d1d5db;border-radius:10px;padding:0 12px;font-size:14px;width:100%;">' +
            '<option value="low" ' + (task.priority === 'low' ? 'selected' : '') + '>🟢 Низкий</option>' +
            '<option value="medium" ' + (task.priority === 'medium' ? 'selected' : '') + '>🟡 Средний</option>' +
            '<option value="high" ' + (task.priority === 'high' ? 'selected' : '') + '>🟠 Высокий</option>' +
            '<option value="critical" ' + (task.priority === 'critical' ? 'selected' : '') + '>🔴 Критичный</option>' +
            '</select></div>' +

            '<div class="info-box"><span>Дедлайн</span><h4 style="color:' + (task.is_overdue ? '#ef4444' : 'inherit') + '">' + (task.deadline ? new Date(task.deadline).toLocaleString('ru-RU') : 'Не указан') + '</h4></div>' +
            '<div class="info-box"><span>Проект</span><h4>' + (task.project_name || 'Без проекта') + '</h4></div>' +
            '<div class="info-box"><span>Создатель</span><h4>' + (task.creator?.full_name || '—') + '</h4></div>' +
            '<div class="info-box"><span>Дата создания</span><h4>' + new Date(task.created_at).toLocaleString('ru-RU') + '</h4></div>' +
            '</div>' +

            '<div style="margin-top:12px;display:flex;gap:8px;">' +
            '<button class="btn btn-outline btn-sm" style="padding:8px 16px;" onclick="openShareModal()">📨 Поделиться</button>' +
            '</div>' +

            '<button class="btn btn-primary" style="margin-top:20px;" onclick="saveChanges()">💾 Сохранить</button>' +

            '<div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;">' +
            '<button class="btn btn-outline btn-sm" onclick="changeStatus(\'todo\')">📋 К выполнению</button>' +
            '<button class="btn btn-outline btn-sm" onclick="changeStatus(\'in_progress\')">⚡ В работу</button>' +
            '<button class="btn btn-outline btn-sm" onclick="changeStatus(\'review\')">👀 На проверку</button>' +
            '<button class="btn btn-sm" style="background:#10b981;color:white;border:none;" onclick="changeStatus(\'done\')">✅ Выполнено</button>' +
            '<button class="btn btn-outline btn-sm" style="color:#ef4444;border-color:#ef4444;" onclick="deleteTask()">🗑 Удалить</button>' +
            '</div>';

        var cl = document.getElementById('commentsList');
        cl.innerHTML = comments.length === 0 ? '<p style="color:#9ca3af;">Нет комментариев</p>' :
            comments.map(function(c) { return '<div style="background:rgba(255,255,255,.7);border-radius:16px;padding:16px;margin-bottom:12px;"><div style="display:flex;justify-content:space-between;"><strong>' + (c.author?.full_name || '—') + '</strong><small>' + new Date(c.created_at).toLocaleString('ru-RU') + '</small></div><p style="margin:0;">' + c.text + '</p></div>'; }).join('');
    });
}

function saveChanges() {
    var assignee = document.getElementById('editAssignee').value;
    var priority = document.getElementById('editPriority').value;
    fetch(A + '/tasks/tasks/' + taskId + '/', {
        method: 'PATCH', headers: H,
        body: JSON.stringify({ assignee: assignee || null, priority: priority })
    }).then(function() { window.location.href = '/tasks/'; });
}

function changeStatus(status) {
    fetch(A + '/tasks/tasks/' + taskId + '/status/', {
        method: 'PATCH', headers: H, body: JSON.stringify({ status: status })
    }).then(function() { loadTask(); });
}

function openShareModal() {
    document.getElementById('shareEmail').value = '';
    document.getElementById('shareRole').value = 'viewer';
    document.getElementById('shareError').style.display = 'none';
    document.getElementById('shareModal').style.display = 'flex';
}
function closeShareModal() { document.getElementById('shareModal').style.display = 'none'; }

function sendShare() {
    var email = document.getElementById('shareEmail').value;
    var role = document.getElementById('shareRole').value;
    if (!email) { document.getElementById('shareError').textContent = 'Введите email'; document.getElementById('shareError').style.display = 'block'; return; }

    fetch(A + '/tasks/tasks/' + taskId + '/share/', {
        method: 'POST', headers: H,
        body: JSON.stringify({ email: email, role: role })
    }).then(r => r.json()).then(function(d) {
        if (d.status === 'shared') {
            closeShareModal();
            alert('Задача отправлена!');
        } else {
            document.getElementById('shareError').textContent = d.error;
            document.getElementById('shareError').style.display = 'block';
        }
    });
}

function addComment() {
    var text = document.getElementById('commentInput').value;
    if (!text) return;
    fetch(A + '/tasks/tasks/' + taskId + '/comments/', {
        method: 'POST', headers: H, body: JSON.stringify({ text: text })
    }).then(function() { document.getElementById('commentInput').value = ''; loadTask(); });
}

function deleteTask() {
    if (!confirm('Удалить задачу?')) return;
    fetch(A + '/tasks/tasks/' + taskId + '/', {
        method: 'DELETE', headers: { 'Authorization': 'Bearer ' + T }
    }).then(function() { window.location.href = '/tasks/'; });
}

loadTask();
</script>

{% endblock %}
