{% extends 'base.html' %}
{% block title %}Задачи — Task Tracker{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-kanban"></i> Канбан-доска</h2>
        <div class="d-flex gap-2">
            <select class="form-select" id="projectFilter" onchange="loadBoard()">
                <option value="">Все проекты</option>
            </select>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="resetTaskForm()">
                <i class="bi bi-plus-lg"></i> Новая задача
            </button>
        </div>
    </div>

    <div id="emptyState" class="text-center py-5 d-none">
        <i class="bi bi-inbox display-1 text-muted"></i>
        <h3 class="text-muted mt-3">Нет задач</h3>
        <p class="text-muted">Создайте первую задачу для этого проекта</p>
        <button class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#taskModal" onclick="resetTaskForm()">
            <i class="bi bi-plus-lg"></i> Создать задачу
        </button>
    </div>

    <!-- Канбан-доска -->
    <div class="kanban-board d-flex gap-3 overflow-auto pb-3" id="kanbanBoard">
        <div class="kanban-column card shadow-sm">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <strong><i class="bi bi-archive me-1"></i>Бэклог</strong>
                <span class="badge bg-light text-dark" id="countBacklog">0</span>
            </div>
            <div class="card-body p-2" id="backlog" style="min-height: 200px; max-height: 70vh; overflow-y: auto;"></div>
        </div>
        <div class="kanban-column card shadow-sm">
            <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                <strong><i class="bi bi-list-task me-1"></i>К выполнению</strong>
                <span class="badge bg-light text-dark" id="countTodo">0</span>
            </div>
            <div class="card-body p-2" id="todo" style="min-height: 200px; max-height: 70vh; overflow-y: auto;"></div>
        </div>
        <div class="kanban-column card shadow-sm">
            <div class="card-header bg-warning text-dark d-flex justify-content-between align-items-center">
                <strong><i class="bi bi-arrow-repeat me-1"></i>В работе</strong>
                <span class="badge bg-dark text-white" id="countInProgress">0</span>
            </div>
            <div class="card-body p-2" id="in_progress" style="min-height: 200px; max-height: 70vh; overflow-y: auto;"></div>
        </div>
        <div class="kanban-column card shadow-sm">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <strong><i class="bi bi-eye me-1"></i>На проверке</strong>
                <span class="badge bg-light text-dark" id="countReview">0</span>
            </div>
            <div class="card-body p-2" id="review" style="min-height: 200px; max-height: 70vh; overflow-y: auto;"></div>
        </div>
        <div class="kanban-column card shadow-sm">
            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                <strong><i class="bi bi-check-circle me-1"></i>Выполнено</strong>
                <span class="badge bg-light text-dark" id="countDone">0</span>
            </div>
            <div class="card-body p-2" id="done" style="min-height: 200px; max-height: 70vh; overflow-y: auto;"></div>
        </div>
    </div>
</div>

<!-- Модалка задачи -->
<div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="taskModalTitle">Новая задача</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="taskForm">
                    <input type="hidden" name="id" id="taskId">
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Название *</label>
                            <input type="text" name="title" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Приоритет</label>
                            <select name="priority" class="form-select">
                                <option value="low">Низкий</option>
                                <option value="medium" selected>Средний</option>
                                <option value="high">Высокий</option>
                                <option value="critical">Критичный</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="4"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Проект</label>
                            <select name="project" class="form-select" id="taskProject"></select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Дедлайн</label>
                            <input type="datetime-local" name="deadline" class="form-control">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" onclick="saveTask()">Сохранить</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const PRIORITY_COLORS = { low: 'secondary', medium: 'warning', high: 'danger', critical: 'dark' };
const STATUSES = ['backlog', 'todo', 'in_progress', 'review', 'done'];

async function loadBoard() {
    const projectId = document.getElementById('projectFilter').value;
    let url = '/tasks/';
    if (projectId) url += `?project=${projectId}`;

    try {
        const data = await api.get(url);
        const tasks = data.results || [];
        const totalTasks = tasks.length;

        const board = document.getElementById('kanbanBoard');
        const emptyState = document.getElementById('emptyState');

        if (totalTasks === 0) {
            board.classList.add('d-none');
            emptyState.classList.remove('d-none');
            return;
        }

        board.classList.remove('d-none');
        emptyState.classList.add('d-none');

        STATUSES.forEach(status => {
            const container = document.getElementById(status);
            const filtered = tasks.filter(t => t.status === status);
            const countId = 'count' + status.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
            document.getElementById(countId).textContent = filtered.length;

            container.innerHTML = filtered.map(t => `
                <div class="card mb-2 task-card border-start border-${t.priority === 'critical' ? 'dark' : t.priority === 'high' ? 'danger' : t.priority === 'medium' ? 'warning' : 'secondary'} border-3"
                     draggable="true" ondragstart="drag(event)" id="task-${t.id}" data-task-id="${t.id}">
                    <div class="card-body p-2">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <a href="/tasks/${t.id}/" class="small fw-bold text-decoration-none">${t.title}</a>
                            <span class="badge rounded-pill bg-${PRIORITY_COLORS[t.priority]}">${t.priority}</span>
                        </div>
                        <small class="text-muted">${t.assignee?.full_name || 'Не назначена'}</small>
                        ${t.deadline ? `<div class="mt-1"><small class="${t.is_overdue ? 'text-danger' : 'text-muted'}"><i class="bi bi-clock me-1"></i>${new Date(t.deadline).toLocaleDateString()}</small></div>` : ''}
                    </div>
                </div>
            `).join('');
        });
    } catch (e) {
        console.error(e);
    }
}

async function loadProjects() {
    try {
        const data = await api.get('/tasks/projects/');
        const select = document.getElementById('projectFilter');
        const taskSelect = document.getElementById('taskProject');
        select.innerHTML = '<option value="">Все проекты</option>' + data.results.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        taskSelect.innerHTML = '<option value="">Без проекта</option>' + data.results.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('project')) select.value = urlParams.get('project');
    } catch (e) {}
}

function resetTaskForm() {
    document.getElementById('taskModalTitle').textContent = 'Новая задача';
    document.getElementById('taskForm').reset();
    document.getElementById('taskId').value = '';
}

async function saveTask() {
    const form = document.getElementById('taskForm');
    const data = Object.fromEntries(new FormData(form));
    const id = data.id;
    delete data.id;
    if (!data.project) delete data.project;
    if (!data.deadline) delete data.deadline;
    try {
        if (id) await api.patch(`/tasks/${id}/`, data);
        else await api.post('/tasks/', data);
        bootstrap.Modal.getInstance(document.getElementById('taskModal')).hide();
        loadBoard();
    } catch (e) {
        alert('Ошибка сохранения');
    }
}

function allowDrop(ev) { ev.preventDefault(); }
function drag(ev) {
    const card = ev.target.closest('.task-card');
    if (card) ev.dataTransfer.setData("text", card.dataset.taskId);
}
async function drop(ev, newStatus) {
    ev.preventDefault();
    const taskId = ev.dataTransfer.getData("text");
    if (taskId) {
        await api.patch(`/tasks/${taskId}/status/`, { status: newStatus });
        loadBoard();
    }
}

STATUSES.forEach(s => {
    const el = document.getElementById(s);
    if (el) {
        el.addEventListener('dragover', allowDrop);
        el.addEventListener('drop', e => drop(e, s));
    }
});

loadProjects().then(() => loadBoard());
</script>
{% endblock %}
